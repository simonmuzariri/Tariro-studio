name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # D4: Windows and Linux are equal-priority targets.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Golden sketches must compile with the real toolchain (same CLI and core versions as bundled).
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1
      - run: arduino-cli core update-index && arduino-cli core install arduino:avr@1.8.7
      - run: npm run test:compile
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e -w @tariro-studio/app
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e -w @tariro-studio/app
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: packages/app/test-results
